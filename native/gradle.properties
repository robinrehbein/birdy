org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# iOS targets are declared for the future iOS app but cannot be built on Linux.
kotlin.native.ignoreDisabledTargets=true

# AGP 8.13's bundled lint analyses Kotlin with a 2.2 compiler and cannot read Kotlin 2.4 metadata;
# the lint from AGP 9.4 understands it (lint only, the build still uses AGP 8.13).
android.experimental.lint.version=9.4.1
# One JVM instead of Gradle + Kotlin daemons (memory-constrained CI/dev boxes).
kotlin.compiler.execution.strategy=in-process
