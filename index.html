<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4ec0ca" />
    <title>Birdy 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div id="score">0</div>
      <div id="coins"><span class="coin-icon"></span><span id="coin-count">0</span></div>
    </div>

    <div id="start" class="panel-wrap">
      <div class="panel">
        <h1>Birdy <span>3D</span></h1>
        <p class="controls">
          <b>Fliegen:</b> Tippen / Leertaste / ↑<br />
          <b>Spur wechseln:</b> Wischen / ← →
        </p>
        <button id="play-btn">Los geht's</button>
        <p class="best">Rekord: <span id="best-start">0</span></p>
      </div>
    </div>

    <div id="gameover" class="panel-wrap hidden">
      <div class="panel">
        <h2>Game Over</h2>
        <div class="stats">
          <div><small>Punkte</small><strong id="final-score">0</strong></div>
          <div><small>Münzen</small><strong id="final-coins">0</strong></div>
          <div><small>Rekord</small><strong id="final-best">0</strong></div>
        </div>
        <p id="new-best" class="hidden">Neuer Rekord!</p>
        <button id="retry-btn">Nochmal</button>
      </div>
    </div>

    </div>

    <div id="rotate">
      <div class="phone"></div>
      <p>Bitte Handy hochkant halten</p>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
