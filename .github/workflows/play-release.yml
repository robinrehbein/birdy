name: Publish Birdy to Google Play tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  publish:
    if: vars.PLAY_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Configure signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/configure_play_ci.py
      - name: Build signed bundle
        run: |
          # Play version codes must rise above every uploaded bundle, including
          # draft bundles. Reserve four digits per UTC day for runs/retries.
          suffix=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          if (( suffix > 9999 )); then
            echo 'Play version-code suffix exhausted; update the allocation scheme.' >&2
            exit 1
          fi
          export BIRDY_VERSION_CODE=$(( $(date -u +%s) / 86400 * 10000 + suffix ))
          npm run android:aab
      - name: Publish internal and closed Alpha tests
        env:
          PLAY_CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK || 'alpha' }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install 'google-auth>=2,<3' 'requests>=2,<3'
          python3 scripts/publish_play.py android/app/build/outputs/bundle/release/app-release.aab
