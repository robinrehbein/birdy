name: Native app build

on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native-build.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-build.yml']

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The runner image ships an Android SDK (ANDROID_HOME); only make sure
      # the platform and build tools this project compiles against are there.
      - name: Android SDK packages
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: shared unit tests + androidApp debug build + lint
        run: ./gradlew :shared:testDebugUnitTest :androidApp:assembleDebug :androidApp:lintDebug --console=plain

      - name: Upload test/lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-reports
          path: |
            native/shared/build/reports/tests/testDebugUnitTest
            native/androidApp/build/reports/lint-results-debug.html
          if-no-files-found: ignore
