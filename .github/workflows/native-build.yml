name: Native app build

on:
  push:
    branches: [main]
    paths: ['native/**']
  pull_request:
    paths: ['native/**']

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: shared unit tests + androidApp debug build + lint
        run: ./gradlew :shared:testDebugUnitTest :androidApp:assembleDebug :androidApp:lintDebug --console=plain

      - name: Upload test/lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-reports
          path: |
            native/shared/build/reports/tests/testDebugUnitTest
            native/androidApp/build/reports/lint-results-debug.html
          if-no-files-found: ignore
